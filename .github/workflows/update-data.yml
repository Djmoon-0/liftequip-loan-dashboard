name: Update loan dashboard data
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl
      - name: Download OneDrive Excel and rebuild data.json
        env:
          ONEDRIVE_XLSX_URL: ${{ vars.ONEDRIVE_XLSX_URL }}
        run: python scripts/convert_excel.py
      - name: Commit updated data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Update loan dashboard data"
          git push
